repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Lint
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: Mypy Type Check
        entry: uv run mypy app
        language: system
        pass_filenames: false
        always_run: true