[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courtroom-server"
version = "0.1.0"
description = "Production-ready FastAPI backend for courtroom services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["fastapi", "courtroom", "api", "backend"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.23.0",
  "SQLAlchemy>=2.0.18",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.8.0",
  "pwdlib[argon2]==0.3.0",
  "python-jose[cryptography]>=3.5.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.22",
  "pytest-cov>=5.0",
  "httpx>=0.27.0",
  "black>=24.9.0",
  "ruff>=0.0.289",
  "mypy>=1.9.0"
]
