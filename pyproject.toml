[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alibi-server"
version = "0.1.0"
description = "Production-ready FastAPI backend for Alibi."
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["fastapi", "alibi", "api", "backend"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.23.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "pwdlib[argon2]==0.3.0",
  "python-jose[cryptography]>=3.5.0",
  "alembic>=1.16",
  "pip>=26.3",
  "prometheus-client>=0.26.0",
  "redis>=8.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.22",
  "pytest-cov>=5.0",
  "httpx>=0.27.0",
  "black>=24.9.0",
  "ruff>=0.0.289",
  "mypy>=1.9.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.22",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.17.6",
    "mypy>=1.9.0",
    "pre-commit>=4.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
